<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>AV Live Communications | Professional AV & IP Phone Solutions Pakistan</title>
    <meta name="description" content="Pakistan's leading provider of professional AV solutions, IP phones, and video conferencing. Authorized partners for Poly, Cisco, and Grandstream." />
    <meta name="theme-color" content="#1A2B4C" />
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231A2B4C'/><text y='70' x='10' fill='white' style='font: bold 60px sans-serif;'>AV</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
      /* Initial loader styles for perceived performance */
      #initial-loader {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: #F8F9FA;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(0, 180, 216, 0.2);
        border-top-color: #00B4D8;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { 100% { transform: rotate(360deg); } }
      .brand-text {
        margin-top: 20px;
        font-family: 'Inter', sans-serif;
        font-weight: 900;
        color: #1A2B4C;
        font-size: 24px;
        letter-spacing: 2px;
      }
    </style>
  </head>
  <body>
    <div id="initial-loader">
      <div class="spinner"></div>
      <div class="brand-text">AV LIVE</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load', () => {
        const loader = document.getElementById('initial-loader');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => loader.remove(), 500);
        }
      });
    </script>
  </body>
</html>
